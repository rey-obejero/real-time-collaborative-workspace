---
- name: Deploy the knowledge management app monolith
  hosts: all
  become: true

  vars:
    deploy_mode: production # "production" or "emulation"
    app_dir: /opt/knowledge-management-app
    db_name: real_time_collaborative_workspace_database
    db_user: kma_app
    db_password: ""
    jwt_secret: ""
    domain: ""
    duckdns_domain: ""
    duckdns_token: ""

  pre_tasks:
    - name: Validate production configuration
      ansible.builtin.assert:
        that:
          - db_password | length > 0
          - jwt_secret | length > 0
          - domain | length > 0
        fail_msg: >-
          Pass -e db_password=... -e jwt_secret=... -e domain=... for production deploys.
      when: deploy_mode == "production"

  tasks:
    - name: Install system dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - rsync
        state: present
        update_cache: true

    - name: Check whether Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Install Docker Engine
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      when: docker_check.rc != 0

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Sync application source to {{ app_dir }}
      ansible.builtin.command: >-
        rsync -a --delete
        --exclude=.git
        --exclude=node_modules
        --exclude=dist
        --exclude=test-results
        --exclude=playwright-report
        --exclude=documentation
        --exclude=.vagrant
        {{ playbook_dir }}/../../.. {{ app_dir }}/
      changed_when: true

    - name: Write environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          DB_NAME={{ db_name }}
          DB_USER={{ db_user }}
          DB_PASSWORD={{ db_password }}
          JWT_SECRET={{ jwt_secret }}
          DOMAIN={{ domain }}

    - name: Start the production stack
      ansible.builtin.command: >-
        docker compose --env-file {{ app_dir }}/.env
        -f {{ app_dir }}/infrastructure/docker-compose.prod.yml
        up -d --build --wait
      changed_when: true
      when: deploy_mode == "production"

    - name: Write emulation environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        mode: "0600"
        content: |
          E2E_BIND=0.0.0.0
      when: deploy_mode == "emulation"

    - name: Start the emulation stack
      ansible.builtin.command: >-
        docker compose --env-file {{ app_dir }}/.env
        -f {{ app_dir }}/infrastructure/docker-compose.e2e.yml
        up -d --build --wait
      changed_when: true
      when: deploy_mode == "emulation"

    - name: Keep DuckDNS record updated
      ansible.builtin.cron:
        name: DuckDNS dynamic DNS update
        minute: "*/5"
        job: >-
          curl -fsS
          'https://www.duckdns.org/update?domains={{ duckdns_domain }}&token={{ duckdns_token }}&ip='
          > /dev/null
      when: deploy_mode == "production" and duckdns_domain | length > 0
