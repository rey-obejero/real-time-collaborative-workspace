name: real-time-collaborative-workspace

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-real_time_collaborative_workspace_e2e}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../modules/api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${DB_NAME:-real_time_collaborative_workspace_e2e};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:-e2e-only-secret-0123456789abcdef0123456789abcdef}
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: modules/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    command: caddy run --config /etc/caddy/Caddyfile.e2e --adapter caddyfile
    ports:
      - "${E2E_BIND:-127.0.0.1}:8080:80"
    depends_on:
      - api
