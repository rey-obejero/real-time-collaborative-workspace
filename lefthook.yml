pre-commit:
  parallel: true
  commands:
    web-lint:
      root: "modules/web/"
      run: pnpm run lint
    api-build:
      run: dotnet build modules/api/src/KnowledgeManagementApp.Api.csproj

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    api-unit-tests:
      run: dotnet test modules/api/tests/KnowledgeManagementApp.Api.UnitTests
